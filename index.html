<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅사업부 5팀</title>
<style>
  :root {
    --bubble-bg: #ffffff;
    --bubble-fg: #2b2b2b;
    --bubble-line: #3a3a3a;
    --tag-bg: #ffffff;
    --tag-fg: #333333;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0767f7;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: relative; width: 100%; height: 100%; overflow: hidden;
  }
  /* 배경은 항상 가로 전체가 보이게 (위쪽 남는 공간은 하늘색). 시간대별 레이어를 겹쳐 두고 서서히 전환 */
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background-size: 100% auto; background-position: center bottom; background-repeat: no-repeat;
    opacity: 0; transition: opacity 2.5s ease;
  }
  .bg.on { opacity: 1; }
  .walker {
    position: absolute; left: 0; bottom: 0;
    will-change: transform; cursor: grab; touch-action: none;
  }
  .walker.dragging { cursor: grabbing; }
  .shadow {
    position: absolute; left: 50%; bottom: 34px;
    width: 56%; height: 8px; margin-left: -28%;
    background: rgba(0,0,0,.25); border-radius: 50%;
    filter: blur(1px);
  }
  .body {
    position: absolute; left: 0; bottom: 38px; width: 100%;
    transform-origin: 50% 100%;
  }
  .body img {
    display: block; width: 100%; height: auto;
    -webkit-user-drag: none; pointer-events: none;
  }
  /* 발밑 이름표 + 칭호 */
  .labels {
    position: absolute; left: 50%; top: calc(100% - 37px);
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    pointer-events: none;
  }
  .tag {
    background: var(--tag-bg); color: var(--tag-fg);
    font-size: 10px; font-weight: 700; line-height: 1;
    padding: 2px 5px; border-radius: 3px;
    border: 1px solid rgba(0,0,0,.18);
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    white-space: nowrap;
  }

  /* 부팀장 이상 전용 이름표 (그 외는 기본 흰 이름표) */
  .tag.n-legend {
    color: #ffe680; font-size: 11px; padding: 3px 7px;
    background: linear-gradient(180deg, #3b1366 0%, #1d0838 100%);
    border: 1.5px solid #ffcf3f;
    text-shadow: 0 0 3px #ffb300;
    box-shadow: 0 0 5px rgba(255,196,0,.7);
  }
  .tag.n-leader {
    color: #fff;
    background: linear-gradient(180deg, #23408f 0%, #142a6b 100%);
    border: 1px solid #f2c94c;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .tag.n-sub {
    color: #fff;
    background: linear-gradient(180deg, #1aa3a3 0%, #0f7272 100%);
    border: 1px solid #e3f6ff;
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }

  /* 칭호 공통 */
  .title {
    position: relative; overflow: hidden;
    font-size: 10px; font-weight: 800; line-height: 1; letter-spacing: -.2px;
    padding: 3px 7px; border-radius: 4px; white-space: nowrap;
  }
  .title .ic { display: inline-block; margin: 0 2px; }
  .title.shine::after {            /* 반짝 지나가는 빛 */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%);
    background-size: 300% 100%; background-repeat: no-repeat;
    animation: shine var(--shine-dur, 3s) linear infinite;
  }
  @keyframes shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes glow  { 0%,100% { box-shadow: 0 0 4px 1px rgba(255,196,0,.55), inset 0 0 0 1px rgba(255,255,255,.25); }
                     50%     { box-shadow: 0 0 9px 3px rgba(255,196,0,.9),  inset 0 0 0 1px rgba(255,255,255,.4); } }

  /* 1) 본부장 — 가장 화려하게: 보라·금색, 빛 번쩍 + 금빛 오라 */
  .t-legend {
    font-size: 11px; padding: 3px 8px;
    color: #fff3b0;
    background: linear-gradient(180deg, #8f3fd9 0%, #4a138a 55%, #2a0a52 100%);
    border: 2px solid #ffcf3f;
    text-shadow: 0 0 4px #ffb300, 1px 1px 0 #2a0a52;
    animation: glow 1.8s ease-in-out infinite;
    --shine-dur: 2.2s;
  }
  .t-legend .ic { color: #ffd84a; text-shadow: 0 0 4px #ff9d00; }

  /* 2) 팀장 — 적당히 화려하게: 남색·금테, 느린 빛 */
  .t-leader {
    color: #fff;
    background: linear-gradient(180deg, #4f7fe8 0%, #1f3f9c 60%, #142a6b 100%);
    border: 1.5px solid #f2c94c;
    text-shadow: 1px 1px 0 #0b1a47;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    --shine-dur: 3.5s;
  }
  .t-leader .ic { color: #ffd84a; }

  /* 3) 부팀장 — 무난하게 멋있게: 청록·은테 */
  .t-sub {
    color: #fff;
    background: linear-gradient(180deg, #36c2c2 0%, #138787 100%);
    border: 1.5px solid #e3f6ff;
    text-shadow: 1px 1px 0 #0a4f4f;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
    --shine-dur: 5s;
  }
  .t-sub .ic { color: #e9fbff; }

  /* 4) 마케터 — 평범하게: 연두 */
  .t-marketer {
    color: #2e5a1b;
    background: linear-gradient(180deg, #f1fbe9 0%, #c6e8ae 100%);
    border: 1px solid #5f9e3f;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }

  /* 5) 디자이너 — 평범하게 2: 핑크 */
  .t-designer {
    color: #84264f;
    background: linear-gradient(180deg, #fff0f6 0%, #f8c3da 100%);
    border: 1px solid #d0608f;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }

  .bubble {
    position: absolute; bottom: 100%; left: 50%;
    margin-bottom: 12px;
    max-width: 170px; width: max-content;
    background: var(--bubble-bg); color: var(--bubble-fg);
    border: 2px solid var(--bubble-line); border-radius: 10px;
    padding: 6px 9px; font-size: 12px; font-weight: 600; line-height: 1.35;
    word-break: keep-all; text-align: center;
    box-shadow: 0 2px 0 rgba(0,0,0,.15);
    opacity: 0; transform: translate(var(--bx, -50%), 6px) scale(.85);
    transform-origin: 50% 100%;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: translate(var(--bx, -50%), 0) scale(1); }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; top: 100%; left: var(--tail, 50%);
    border: solid transparent;
  }
  .bubble::before { border-width: 8px 7px 0; border-top-color: var(--bubble-line); margin-left: -7px; }
  .bubble::after  { border-width: 5px 5px 0; border-top-color: var(--bubble-bg); margin-left: -5px; margin-top: -1px; }

  /* 생일 — 머리 위 배너 + 빵빠레 도트 */
  .bday-tag {
    position: absolute; bottom: 100%; left: 50%; margin-bottom: 4px;
    display: none; white-space: nowrap; pointer-events: none;
    font-size: 10.5px; font-weight: 800; color: #fff; letter-spacing: .02em;
    background: linear-gradient(180deg, #ff86bd, #e2457f);
    border: 2px solid #fff3a8; border-radius: 4px; padding: 2px 7px 2px;
    box-shadow: 0 0 0 1px #8a1d47, 0 2px 0 rgba(0,0,0,.25), 0 0 10px rgba(255,180,220,.8);
    text-shadow: 0 1px 0 #8a1d47;
    animation: bdayBob 1.2s ease-in-out infinite;
  }
  .bday-tag .sp { color: #fff3a8; display: inline-block; animation: twinkle .9s steps(2) infinite; }
  .bday-tag .sp + .sp { animation-delay: .45s; }
  .walker.bday .bday-tag { display: block; }
  .walker.bday .bubble { margin-bottom: 32px; }
  @keyframes bdayBob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -3px); } }
  @keyframes twinkle { 0% { opacity: 1; } 100% { opacity: .2; } }
  .confetti {
    position: absolute; left: 50%; bottom: 100%; width: 4px; height: 4px;
    pointer-events: none; z-index: 3; box-shadow: 0 0 0 .5px rgba(0,0,0,.25);
  }

  /* 스탯창 (캐릭터 클릭) */
  .stat {
    position: absolute; z-index: 500; width: 172px;
    background: linear-gradient(180deg, rgba(38,46,74,.96), rgba(22,27,46,.96));
    border: 2px solid #c9a24a; border-radius: 6px;
    box-shadow: 0 0 0 1px #2a1d05, 0 4px 12px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
    color: #e9ecf5; font-size: 11px; line-height: 1.3;
    opacity: 0; transform: scale(.9); transform-origin: var(--ox, 0) 100%;
    transition: opacity .15s ease, transform .15s ease;
    pointer-events: none; user-select: none;
  }
  .stat.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  .stat .hd {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #6b5420, #3f300f);
    border-bottom: 1px solid #c9a24a; padding: 3px 6px 3px 8px;
    font-size: 10px; font-weight: 800; letter-spacing: .08em; color: #f7dc8a;
  }
  .stat .x {
    width: 14px; height: 14px; line-height: 12px; text-align: center; cursor: pointer;
    border: 1px solid #c9a24a; border-radius: 2px; background: #2a2010; color: #f7dc8a; font-size: 10px;
  }
  .stat .x:hover { background: #5a4518; }
  .stat .bd { padding: 7px 8px 8px; }
  .stat .nm { font-size: 14px; font-weight: 800; color: #fff; }
  .stat .rk { color: #aeb8d6; font-size: 10.5px; margin-top: 1px; }
  .stat .row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .stat .vl { font-size: 10.5px; color: #e9ecf5; }
  .stat .vl b { color: #9fe0ff; font-weight: 700; }
  .stat .lb { color: #f7dc8a; font-size: 9.5px; font-weight: 800; width: 34px; flex: none; }
  .stat .mbti {
    background: linear-gradient(180deg, #ff9fd0, #d8589b); color: #fff; font-weight: 800;
    border-radius: 3px; padding: 1px 6px; font-size: 10.5px; letter-spacing: .06em;
    text-shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  .stat .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .stat .chip {
    background: rgba(255,255,255,.08); border: 1px solid rgba(201,162,74,.6); color: #ffe9a8;
    border-radius: 3px; padding: 1px 5px; font-size: 10px; font-weight: 700;
  }
</style>
</head>

function sceneForHour(h) {
  if (h >= 8 && h < 17) return 'day';

function labelsHTML(name) {
  const t = TITLES[name];
  const s = t ? TITLE_STYLES[t[1]] : null;

  const title = s ? `<div class="title ${s.cls}">${ic(s.pre)}${t[0]}${ic(s.post)}</div>` : '';
  return `<div class="labels">${tag}${title}</div>`;
}

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

let W = 0, H = 0, K = 1, bgH = 0, charH = 100, groundBack = 60, groundFront = 55;
function measure() {
  W = stage.clientWidth; H = stage.clientHeight;
  K = W / BG.w;                              // 배경 이미지 1px → 화면 px
  bgH = BG.h * K;                            // background-size: 100% auto, 아래 기준 정렬
  groundBack = bgH * BG.groundBack;
  groundFront = bgH * BG.groundFront;
  charH = Math.max(30, Math.min(70, bgH * 0.18));   // 배경 크기에 비례 (메이플 비율)
}

// 서 있을 수 있는 땅: 0 = 바닥, 1.. = 공중 발판
function surfaceFeet(w, i) {                 // 화면 아래에서 발까지의 높이(px)
  if (i === 0) return groundBack + (groundFront - groundBack) * w.depth;
  return (BG.h - BG.platforms[i - 1].y) * K;
}
function surfaceRange(w, i) {                // 캐릭터 왼쪽 x가 움직일 수 있는 범위
  if (i === 0) return [0, W - w.w];
  const p = BG.platforms[i - 1];
  return [p.x0 * K - w.w / 2, p.x1 * K - w.w / 2];
}
// 현재 위치 아래에서 가장 가까운 땅 찾기
function landingSurface(w) {
  const cx = w.x + w.w / 2;
  let best = 0, bestFeet = surfaceFeet(w, 0);
  BG.platforms.forEach((p, k) => {
    const f = surfaceFeet(w, k + 1);
    if (cx >= p.x0 * K && cx <= p.x1 * K && f <= w.fb + 1 && f > bestFeet) { best = k + 1; bestFeet = f; }
  });
  return best;
}

let recentLines = [];
function nextLine(w) {
  const role = TITLES[w.name] && TITLES[w.name][1];
  const pool = role && LINES_BY_ROLE[role] && Math.random() < .5 ? LINES_BY_ROLE[role] : LINES_COMMON;
  let l, guard = 0;
  do { l = pick(pool); } while (recentLines.includes(l) && ++guard < 30);
  recentLines.push(l); if (recentLines.length > 20) recentLines.shift();
  return l;
}

// 모두 골고루 말하도록: 섞은 순서대로 돌아가며, 한 바퀴 끝나면 다시 섞기
let speakQueue = [];
function nextSpeaker() {
  for (let tries = 0; tries < 2; tries++) {
    if (!speakQueue.length) speakQueue = walkers.slice().sort(() => Math.random() - .5);
    const i = speakQueue.findIndex(w => w.talking <= 0 && w.state === 'walk');
    if (i >= 0) return speakQueue.splice(i, 1)[0];
    if (tries === 0 && speakQueue.length < walkers.length) speakQueue = [];
  }
  return null;
}

/* 드래그 & 드롭 (클릭만 하면 점프 + 한마디) */
function attachDrag(w) {
  let startX = 0, startY = 0, offX = 0, offY = 0, moved = false, down = false;
  const toLocal = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  w.el.addEventListener('pointerdown', e => {
    if (!w.placed) return;
    e.preventDefault();
    w.el.setPointerCapture(e.pointerId);
    const [px, py] = toLocal(e);
    startX = px; startY = py; moved = false; down = true;
    const feetFromBottom = w.state === 'walk' ? surfaceFeet(w, w.surf) : w.fb;
    offX = px - w.x; offY = (H - py) - feetFromBottom;
  });
  w.el.addEventListener('pointermove', e => {
    if (!down) return;
    const [px, py] = toLocal(e);
    if (!moved && Math.hypot(px - startX, py - startY) < 5) return;
    if (!moved) { moved = true; w.state = 'drag'; w.el.classList.add('dragging'); openStat(w); }
    w.x = Math.max(0, Math.min(W - w.w, px - offX));
    w.fb = Math.max(0, Math.min(H - w.h * .3, (H - py) - offY));
  });
  const up = () => {
    if (!down) return;
    down = false;
    w.el.classList.remove('dragging');
    if (moved) { w.state = 'fall'; w.pause = rand(.8, 1.5); }
    else { if (w.jump <= 0) w.jump = .55; say(w); }
  };
  w.el.addEventListener('pointerup', up);
  w.el.addEventListener('pointercancel', up);
}

let prevW = 0;
function layout() {
  measure();
  if (W <= 0) return;
  const ratioW = prevW > 0 ? W / prevW : 1;   // 너비가 바뀌면 위치도 같은 비율로
  prevW = W;
  walkers.forEach((w, i) => {
    w.x *= ratioW;
    if (w.state !== 'walk') w.fb *= ratioW;
    const h = charH * (0.92 + w.depth * 0.08);
    w.h = h; w.w = h * w.ratio;
    w.el.style.width = w.w + 'px';
    w.el.style.height = (h + FOOT) + 'px';
    if (!w.placed) {
      const s = savedPos[w.name];
      if (s && s.surf >= 0 && s.surf <= BG.platforms.length) {   // 지난번 위치 복원
        w.surf = s.surf; w.dir = s.dir === -1 ? -1 : 1;
        const [lo, hi] = surfaceRange(w, w.surf);
        w.x = Math.max(lo, Math.min(hi, s.x * W - w.w / 2));
      } else {
        w.x = (W / walkers.length) * (i + rand(.1, .9)) - w.w / 2;
      }
      w.placed = true;
    }
  });
}

function say(w) {

function positionBubble(w) {
  const bw = w.bubble.offsetWidth || 120;

}

let talkTimer = 1.2;
let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;

  talkTimer -= dt;
  if (talkTimer <= 0) {
    const busy = walkers.filter(w => w.talking > 0).length;
    if (busy < 2) { const s = nextSpeaker(); if (s) say(s); }
    talkTimer = rand(1.6, 3);
  }

  for (const w of walkers) {
    if (!w.placed) continue;
    let feet, y = 0, tilt = 0;

    if (w.state === 'drag') {
      feet = w.fb;
      tilt = Math.sin(now / 120) * 6;                             // 잡혀서 버둥버둥
    } else if (w.state === 'fall') {
      const target = landingSurface(w);
      const tf = surfaceFeet(w, target);
      w.fb -= FALL_SPEED * dt;
      tilt = Math.sin(now / 200) * 3;
      if (w.fb <= tf) {
        w.fb = tf; w.surf = target; w.state = 'walk';
        if (statOwner === w) statHide = 1.5;                       // 착지하고 잠깐 뒤 닫기
      }
      feet = w.fb;
    } else {
      if (w === statOwner) w.pause = Math.max(w.pause, .3);       // 스탯창 열려 있으면 제자리에
      const walking = w.pause <= 0;
      if (!walking) w.pause -= dt;
      else {
        w.x += w.dir * w.speed * dt;
        if (Math.random() < dt * 0.15) w.dir *= -1;               // 가끔 뒤돌기
        if (Math.random() < dt * 0.18) w.pause = rand(1, 3);      // 가끔 멈춰 서기
      }
      const [lo, hi] = surfaceRange(w, w.surf);
      if (w.x < lo) { w.x = lo; w.dir = 1; }
      if (w.x > hi) { w.x = hi; w.dir = -1; }

      // 걸을 때만 가볍게 통통
      w.hopAmp += ((walking ? 1 : 0) - w.hopAmp) * Math.min(1, dt * 6);
      w.hopT += dt / w.hopDur;
      y = Math.abs(Math.sin(w.hopT * Math.PI)) * w.hopH * w.hopAmp;
      if (w.jump > 0) {
        const q = 1 - w.jump / .55;
        y = Math.max(y, Math.sin(q * Math.PI) * w.h * .25);
        w.jump -= dt;
      }
      feet = surfaceFeet(w, w.surf);
    }

    const face = w.dir * w.native;   // 그림 방향과 이동 방향이 다르면 반전
    w.body.style.transform = `translateY(${-y}px) rotate(${tilt}deg) scaleX(${face})`;
    const s = 1 - Math.min(.4, y / (w.h * .5));
    w.shadow.style.transform = `scale(${s})`;
    w.shadow.style.opacity = w.state === 'walk' ? s : 0;

    w.el.style.transform = `translate(${w.x}px, ${-(feet - FOOT)}px)`;
    if (w === statOwner) {
      positionStat(w, feet);
      if (statHide > 0 && (statHide -= dt) <= 0) closeStat();
    }
    w.el.style.zIndex = w.state !== 'walk' ? 200 : w.talking > 0 ? 100 : w.bday ? 90 : (w.surf ? 5 : 10 + Math.round(w.depth * 50));
    if (w.bday && (w.confT = (w.confT ?? .5) - dt) <= 0) { popConfetti(w); w.confT = rand(2.6, 3.6); }

    if (w.talking > 0) {
      w.talking -= dt;
      positionBubble(w);
      if (w.talking <= 0) w.bubble.classList.remove('show');
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
