<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅사업부 5팀</title>
<style>
  :root {
    --bubble-bg: #ffffff;
    --bubble-fg: #2b2b2b;
    --bubble-line: #3a3a3a;
    --tag-bg: #ffffff;
    --tag-fg: #333333;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #6fb3f0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background-size: cover; background-position: center bottom; background-repeat: no-repeat;
  }
  .walker {
    position: absolute; left: 0; bottom: 0;
    will-change: transform; cursor: pointer;
  }
  .shadow {
    position: absolute; left: 50%; bottom: 16px;
    width: 56%; height: 8px; margin-left: -28%;
    background: rgba(0,0,0,.25); border-radius: 50%;
    filter: blur(1px);
  }
  .body {
    position: absolute; left: 0; bottom: 20px; width: 100%;
    transform-origin: 50% 100%;
  }
  .body img {
    display: block; width: 100%; height: auto;
    -webkit-user-drag: none; pointer-events: none;
  }
  .tag {
    position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    background: var(--tag-bg); color: var(--tag-fg);
    font-size: 11px; font-weight: 700; line-height: 1;
    padding: 3px 7px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,.18);
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    white-space: nowrap;
  }
  .bubble {
    position: absolute; bottom: 100%; left: 50%;
    margin-bottom: 16px;
    max-width: 170px; width: max-content;
    background: var(--bubble-bg); color: var(--bubble-fg);
    border: 2px solid var(--bubble-line); border-radius: 10px;
    padding: 6px 9px; font-size: 12px; font-weight: 600; line-height: 1.35;
    word-break: keep-all; text-align: center;
    box-shadow: 0 2px 0 rgba(0,0,0,.15);
    opacity: 0; transform: translate(var(--bx, -50%), 6px) scale(.85);
    transform-origin: 50% 100%;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: translate(var(--bx, -50%), 0) scale(1); }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; top: 100%; left: var(--tail, 50%);
    border: solid transparent;
  }
  .bubble::before { border-width: 8px 7px 0; border-top-color: var(--bubble-line); margin-left: -7px; }
  .bubble::after  { border-width: 5px 5px 0; border-top-color: var(--bubble-bg); margin-left: -5px; margin-top: -1px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ===== 설정 ===== */
const BG = {
  url: 'img/bg.jpg',
  w: 2000, h: 579,
  // 이미지 아래쪽에서부터 잔디(발 디딜 곳)까지의 비율: 뒤쪽 ~ 앞쪽
  groundBack: 0.245, groundFront: 0.22,
};

// 캐릭터 그림은 모두 왼쪽을 보고 있음 → 오른쪽으로 갈 때 좌우 반전
const MEMBERS = [
  ['c01.png','김경빈',157], ['c02.png','김수진',143], ['c03.png','김지원',148], ['c04.png','민길상',139],
  ['c05.png','박정은',128], ['c06.png','변하정',134], ['c07.png','소병훈',149], ['c08.png','신동협',130],
  ['c09.png','양서진',130], ['c10.png','이원빈',125], ['c11.png','이혜경',160], ['c12.png','정나라',155],
  ['c13.png','정유진',153], ['c14.png','조소영',148],
];
const NATIVE_H = 260;

const LINES = [
  '오늘 점심 뭐 먹지?', '커피 수혈이 필요해…', '퇴근까지 몇 시간 남았지?', '월요병 실화냐',
  '불금이다!!', '회의 또 있어요?', '이거 오늘까지예요?', '메일 확인 부탁드려요~',
  '보고서 다 썼다!', '야근은 안 돼… 제발', '광고 성과 잘 나왔다!', 'ROAS 미쳤다 🔥',
  '소재 컨펌 났어요!', '피드백 반영 완료!', '아이디어 떠올랐어!', '잠깐 스트레칭 좀…',
  '아아 한 잔 하실 분?', '오늘도 화이팅!', '수고하셨습니다~', '좋은 아침이에요!',
  '탕비실 간식 털러 간다', '엑셀 함수 아시는 분?', '마감 D-1…', '오늘 날씨 좋다~',
  '주말 언제 와…', '이번 주 너무 길다', '점심 먹고 졸려…', '내일 연차예요 😎',
  '월급날 언제야', '팀장님 찾으세요?', '자료 공유드렸어요!', '캘린더 확인해주세요~',
  '오늘 회식인가요?', '배고파…', '집에 가고 싶다', '클라이언트 연락 왔어요!',
  '카피 한 줄만 더…', '썸네일 뭐가 나아요?', '대박 아이디어 있어!', '오늘 일 다 했다!',
  '간식 사왔어요~', '노트북 배터리 3%…', '와이파이 왜 이래', '잠깐 회의실 쓸게요',
  '이번 캠페인 잘될 거야!', '우리 팀 최고!', '하이파이브! 🖐', '칼퇴 가즈아!',
  '조금만 더 힘내요!', '오늘도 수고 많았어요',
];

/* ===== 동작 ===== */
const stage = document.getElementById('stage');
stage.style.backgroundImage = `url("${BG.url}")`;

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

let W = 0, H = 0, charH = 100, groundBack = 60, groundFront = 55;
function measure() {
  W = stage.clientWidth; H = stage.clientHeight;
  const s = Math.max(W / BG.w, H / BG.h);   // background-size: cover
  const bgH = BG.h * s;                      // 아래 기준 정렬
  groundBack = bgH * BG.groundBack;
  groundFront = bgH * BG.groundFront;
  const room = H - groundBack;               // 땅 위 남은 공간
  charH = Math.max(45, Math.min(85, room * 0.4));
}

let recentLines = [];
function nextLine() {
  let l, guard = 0;
  do { l = pick(LINES); } while (recentLines.includes(l) && ++guard < 20);
  recentLines.push(l); if (recentLines.length > 15) recentLines.shift();
  return l;
}

const walkers = MEMBERS.map(([file, name, nw]) => {
  const el = document.createElement('div'); el.className = 'walker';
  el.innerHTML = `<div class="shadow"></div><div class="bubble"></div>
    <div class="body"><img src="img/${file}" alt="${name}"></div><div class="tag">${name}</div>`;
  stage.appendChild(el);
  const w = {
    el, name,
    body: el.querySelector('.body'), shadow: el.querySelector('.shadow'),
    bubble: el.querySelector('.bubble'),
    ratio: nw / NATIVE_H,
    x: 0, depth: Math.random(),          // 0 = 뒤, 1 = 앞
    dir: Math.random() < .5 ? -1 : 1,
    speed: rand(20, 34),                 // px/s
    hopT: Math.random(), hopDur: rand(.5, .6), hopH: rand(3, 5),
    hopAmp: 0,                           // 걷는 중 1, 멈추면 0으로 부드럽게
    jump: 0, pause: rand(0, 2), talking: 0,
  };
  el.addEventListener('click', () => { if (w.jump <= 0) w.jump = .55; say(w); });
  return w;
});

function layout() {
  measure();
  walkers.forEach((w, i) => {
    const h = charH * (0.92 + w.depth * 0.08);
    w.h = h; w.w = h * w.ratio;
    w.el.style.width = w.w + 'px';
    w.el.style.height = (h + 20) + 'px';
    if (!w.placed && W > 0) { w.x = (W / walkers.length) * (i + rand(.1, .9)) - w.w / 2; w.placed = true; }
  });
}
layout();
new ResizeObserver(layout).observe(stage);

function say(w) {
  w.bubble.textContent = nextLine();
  w.talking = rand(3, 4);
  w.pause = Math.max(w.pause, w.talking * .8);   // 말할 때는 멈춰서
  positionBubble(w);
  w.bubble.classList.add('show');
}
function positionBubble(w) {
  const bw = w.bubble.offsetWidth || 120;
  const center = w.x + w.w / 2;
  let left = center - bw / 2;
  left = Math.max(4, Math.min(W - bw - 4, left));
  const shift = left - (center - bw / 2);
  w.bubble.style.setProperty('--bx', `calc(-50% + ${shift}px)`);
  w.bubble.style.setProperty('--tail', `${50 - shift / bw * 100}%`);
}

let talkTimer = 1.2;
let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;

  talkTimer -= dt;
  if (talkTimer <= 0) {
    const free = walkers.filter(w => w.talking <= 0);
    const busy = walkers.length - free.length;
    if (free.length && busy < 2) say(pick(free));
    talkTimer = rand(1.6, 3);
  }

  for (const w of walkers) {
    const walking = w.pause <= 0;
    if (!walking) w.pause -= dt;
    else {
      w.x += w.dir * w.speed * dt;
      if (Math.random() < dt * 0.15) w.dir *= -1;                 // 가끔 뒤돌기
      if (Math.random() < dt * 0.18) w.pause = rand(1, 3);        // 가끔 멈춰 서기
    }
    if (!w.placed) continue;
    if (w.x < 0) { w.x = 0; w.dir = 1; }
    if (w.x > W - w.w) { w.x = W - w.w; w.dir = -1; }

    // 걸을 때만 가볍게 통통
    w.hopAmp += ((walking ? 1 : 0) - w.hopAmp) * Math.min(1, dt * 6);
    w.hopT += dt / w.hopDur;
    let y = Math.abs(Math.sin(w.hopT * Math.PI)) * w.hopH * w.hopAmp;
    if (w.jump > 0) {
      const q = 1 - w.jump / .55;
      y = Math.max(y, Math.sin(q * Math.PI) * w.h * .25);
      w.jump -= dt;
    }

    const face = -w.dir;   // 그림이 왼쪽을 보고 있으므로
    w.body.style.transform = `translateY(${-y}px) scaleX(${face})`;
    const s = 1 - Math.min(.4, y / (w.h * .5));
    w.shadow.style.transform = `scale(${s})`; w.shadow.style.opacity = s;

    const feet = groundBack + (groundFront - groundBack) * w.depth;
    w.el.style.transform = `translate(${w.x}px, ${-(feet - 20)}px)`;
    w.el.style.zIndex = w.talking > 0 ? 100 : Math.round(w.depth * 50);

    if (w.talking > 0) {
      w.talking -= dt;
      positionBubble(w);
      if (w.talking <= 0) w.bubble.classList.remove('show');
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
